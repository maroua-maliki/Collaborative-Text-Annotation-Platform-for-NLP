<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Utilisateur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Styles conservés mais sans modification des éléments de navigation -->
    <style>
        .welcome-card {
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-light) 0%, rgba(76, 201, 240, 0.2) 100%);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .welcome-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .welcome-subtitle {
            color: var(--text-medium);
        }

        /* Stat Cards */
        .stat-card {
            height: 100%;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
            border-radius: 12px;
            transition: all var(--transition-fast) ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-title {
            font-size: 0.9rem;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0;
            color: var(--text-dark);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .task-icon {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .complete-icon {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        .text-icon {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stat-progress {
            height: 8px;
            border-radius: 4px;
            background-color: var(--bg-sidebar);
            overflow: hidden;
        }

        .stat-progress .progress-bar {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 4px;
        }
        /* Enhanced Action Cards */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
            margin: 0 auto;
            max-width: 1200px;
        }

        .action-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }

        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .action-card.task-action::before {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
        }

        .action-card.annotate-action::before {
            background: linear-gradient(to bottom, var(--primary), var(--primary-dark));
        }

        .action-card-content {
            padding: 1.5rem;
            flex: 1;
        }

        .action-card-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 1.25rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all var(--transition-normal) ease;
        }

        .task-icon {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .annotate-icon {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .profile-icon {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        }

        .action-card:hover .action-card-icon {
            transform: scale(1.1);
        }

        .action-card-title {
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all var(--transition-fast) ease;
        }

        .action-card-desc {
            margin-bottom: 1.25rem;
            color: var(--text-medium);
            font-size: 0.875rem;
            flex-grow: 1;
        }

        .action-card-arrow {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 1.25rem;
            color: var(--text-light);
            opacity: 0;
            transform: translateX(-10px);
            transition: all var(--transition-fast) ease;
        }

        .action-card:hover .action-card-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--primary);
        }
    </style>
</head>
<body>
<div layout:fragment="content1">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card welcome-card">
                <div class="card-body d-flex align-items-center p-4">
                    <div class="welcome-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="welcome-content ms-4">
                        <h2 class="welcome-title mb-1">Bienvenue, <span th:text="${#authentication.principal.username}">Utilisateur</span></h2>
                        <p class="welcome-subtitle mb-0">Votre espace d'annotation personnel vous attend</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cartes de statistiques -->
    <div class="row mb-4">
        <!-- Tâches en cours -->
        <div class="col-md-4">
            <div class="card stat-card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="stat-title">Tâches en cours</h6>
                            <h3 class="stat-value" th:text="${tachesEnCours}">0</h3>
                        </div>
                        <div class="stat-icon task-icon">
                            <i class="bi bi-list-task"></i>
                        </div>
                    </div>
                    <div class="stat-progress mt-3">
                        <div class="progress-bar" role="progressbar"
                             th:style="'width: ' + ${tachesEnCours + tachesTerminees > 0 ?
                             (tachesEnCours * 100 / (tachesEnCours + tachesTerminees)) : 0} + '%;'">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tâches terminées -->
        <div class="col-md-4">
            <div class="card stat-card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="stat-title">Tâches terminées</h6>
                            <h3 class="stat-value" th:text="${tachesTerminees}">0</h3>
                        </div>
                        <div class="stat-icon complete-icon">
                            <i class="bi bi-check-circle"></i>
                        </div>
                    </div>
                    <div class="stat-progress mt-3">
                        <div class="progress-bar" role="progressbar"
                             th:style="'width: ' + ${tachesEnCours + tachesTerminees > 0 ?
                             (tachesTerminees * 100 / (tachesEnCours + tachesTerminees)) : 0} + '%;'">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Textes annotés -->
        <div class="col-md-4">
            <div class="card stat-card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="stat-title">Textes annotés</h6>
                            <h3 class="stat-value" th:text="${textesAnnotes}">0</h3>
                        </div>
                        <div class="stat-icon text-icon">
                            <i class="bi bi-file-text"></i>
                        </div>
                    </div>
                    <div class="stat-progress mt-3">
                        <div class="progress-bar" role="progressbar"
                             th:style="'width: ' + ${textesAnnotes > 0 ? 100 : 0} + '%;'">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Quick Actions -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-lightning-charge me-2 text-primary"></i>
                        Actions rapides
                    </h5>
                    <span class="badge rounded-pill action-badge">3 actions disponibles</span>
                </div>
                <div class="card-body p-4">
                    <div class="actions-grid">
                        <a th:href="@{/user/tache/list}" class="action-card task-action">
                            <div class="action-card-content">
                                <div class="action-card-icon task-icon">
                                    <i class="bi bi-list-task"></i>
                                </div>
                                <h5 class="action-card-title">Voir mes tâches</h5>
                                <p class="action-card-desc">Consultez toutes vos tâches d'annotation</p>
                            </div>
                            <div class="action-card-arrow">
                                <i class="bi bi-arrow-right"></i>
                            </div>
                        </a>

                        <a href="#" class="action-card annotate-action">
                            <div class="action-card-content">
                                <div class="action-card-icon annotate-icon">
                                    <i class="bi bi-pencil-square"></i>
                                </div>
                                <h5 class="action-card-title">Commencer l'annotation</h5>
                                <p class="action-card-desc">Démarrer une nouvelle session d'annotation</p>
                            </div>
                            <div class="action-card-arrow">
                                <i class="bi bi-arrow-right"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Welcome Section, Stats Cards, etc. -->
</div>
<!-- Suppression du script qui interfère avec la sidebar -->
</body>
</html>
