<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Annotation Platform</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap");
        :root{
            /* Original colors from template.css */
            --primary: #4361ee;
            --primary-light: #eef2ff;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #4cc9f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            
            /* Text Colors */
            --text-dark: #1f2937;
            --text-medium: #6b7280;
            --text-light: #9ca3af;
            
            /* Background Colors */
            --bg-main: #f9fafb;
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-sidebar: rgba(67, 97, 238, 0.03);
            --bg-sidebar-hover: rgba(67, 97, 238, 0.08);
            --bg-sidebar-active: rgba(67, 97, 238, 0.12);
            
            /* Glass Effects */
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
            --backdrop-blur: 8px;
            
            /* New template variables */
            --header-height: 3rem;
            --nav-width: 68px;
            --first-color: #4361ee; /* Using primary color */
            --first-color-light: #AFA5D9;
            --white-color: #F7F6FB;
            --body-font: 'Nunito', sans-serif;
            --normal-font-size: 1rem;
            --z-fixed: 100;
            
            /* Border radius */
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
        }
        
        *,::before,::after{
            box-sizing: border-box}
        body{
            position: relative;
            margin: var(--header-height) 0 0 0;
            padding: 0 1rem;
            font-family: var(--body-font);
            font-size: var(--normal-font-size);
            transition: .5s;
            background-color: var(--bg-main);
            color: var(--text-dark);
        }
        a{
            text-decoration: none}
        .header{
                width: 100%;height: var(--header-height);
                position: fixed;top: 0;left: 0;display: flex;
                align-items: center;justify-content: space-between;
                padding: 0 1rem;background-color: var(--bg-card);
                z-index: var(--z-fixed);transition: .5s;
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.03);
        }
        .header_toggle{
                color: var(--primary);
                font-size: 1.5rem;cursor: pointer}
        .header_img{width: 35px;
                height: 35px;
                display: flex;
                justify-content: center;
                border-radius: 50%;
                overflow: hidden;
                border: 2px solid var(--glass-border);
        }
        .header_img img{
                width: 40px}
        .l-navbar{
                position: fixed;
                top: 0;
                left: -30%;
                width: var(--nav-width);
                height: 100vh;
                background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
                padding: .5rem 1rem 0 0;
                transition: .5s;
                z-index: var(--z-fixed)}
        .nav{
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden}
        .nav_logo, .nav_link{
                display: grid;
                grid-template-columns: max-content max-content;
                align-items: center;
                column-gap: 1rem;
                padding: .5rem 0 .5rem 1.5rem}
        .nav_logo{
                margin-bottom: 2rem}
        .nav_logo-icon{
                    font-size: 1.25rem;
                    color: var(--white-color)}
        .nav_logo-name{
                    color: var(--white-color);
                    font-weight: 700}
        .nav_link{
                    position: relative;
                    color: var(--first-color-light);
                    margin-bottom: 1.5rem;
                    transition: .3s}
        .nav_link:hover{
                    color: var(--white-color)}
        .nav_icon{
            font-size: 1.25rem}
        .show{
            left: 0}
        .body-pd{
            padding-left: calc(var(--nav-width) + 1rem)}
        .active{
            color: var(--white-color)}
        .active::before{
            content: '';
            position: absolute;
            left: 0;
            width: 2px;
            height: 32px;
            background-color: var(--white-color)}
        .height-100{
            height:100vh}
        @media screen and (min-width: 768px){
            body{
                margin: calc(var(--header-height) + 1rem) 0 0 0;
                padding-left: calc(var(--nav-width) + 2rem)
            }
            .header{
                height: calc(var(--header-height) + 1rem);
                padding: 0 2rem 0 calc(var(--nav-width) + 2rem)
            }
            .header_img{
                width: 40px;
                height: 40px
            }
            .header_img img{
                width: 45px
            }
            .l-navbar{
                left: 0;
                padding: 1rem 1rem 0 0
            }
            .show{
                width: calc(var(--nav-width) + 156px)
            }
            .body-pd{
                padding-left: calc(var(--nav-width) + 188px)
            }
        }
        .header_user {
             position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .user_menu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background: var(--bg-card);
            box-shadow: var(--glass-shadow);
            border-radius: var(--border-radius-md);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            z-index: 999;
        }

        .user_menu a {
            display: block;
            padding: 10px 20px;
            color: var(--text-dark);
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.3s;
        }

        .user_menu a:hover {
            background: var(--bg-sidebar-hover);
            color: var(--primary);
        }
        
        /* Main content area */
        .container-main {
            padding: 20px;
            margin-top: 20px;
            width: 100%;
        }
        
        /* Card Styles */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(var(--backdrop-blur));
            overflow: hidden;
            transition: transform var(--transition-fast) ease, box-shadow var(--transition-fast) ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        }
        
        /* Button Styles */
        .btn-primary {
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            color: white;
            font-weight: 500;
            border-radius: var(--border-radius-sm);
            padding: 0.5rem 1.25rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(67, 97, 238, 0.15);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);
            transform: translateY(-1px);
            background: linear-gradient(90deg, var(--primary-dark) 0%, var(--secondary) 100%);
        }

        .btn-success {
            background: linear-gradient(90deg, var(--success) 0%, #0d9488 100%);
            border: none;
            color: white;
            font-weight: 500;
            border-radius: var(--border-radius-sm);
            padding: 0.5rem 1.25rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.15);
        }

        .btn-success:hover {
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transform: translateY(-1px);
        }
        
        /* Fix for Bootstrap components */
        .btn, .form-control, .card {
            margin-bottom: 10px;
        }
        
        /* Ensure tables are responsive */
        .table-responsive {
            display: block;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Fix for action buttons */
        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .btn-edit {
            color: var(--primary);
            background-color: rgba(67, 97, 238, 0.1);
            border-color: rgba(67, 97, 238, 0.2);
        }
        
        .btn-edit:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }
        
        .btn-delete {
            color: var(--error);
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
        }
        
        .btn-delete:hover {
            background-color: var(--error);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        
        /* Ensure content is visible on mobile */
        @media (max-width: 767px) {
            .container-main {
                padding: 15px;
                margin-top: 10px;
            }
            
            .card-body {
                padding: 15px;
            }
            
            /* Make sure tables scroll horizontally */
            .table {
                min-width: 650px;
            }
        }
        
        /* Class tags */
        .class-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
        }
        /* User info styles */
        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .header_user {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .header_img {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: var(--bg-sidebar-hover);
        }
    </style>
    <!-- Allow for additional styles from child templates -->
    <th:block layout:fragment="css"></th:block>
</head>
<body id="body-pd">
    <header class="header" id="header">
        <div class="header_toggle"> <i class='bx bx-menu' id="header-toggle"></i> </div>
        <div class="header_user">
            <div class="user-info d-none d-md-block me-3">
                <span class="user-name" th:text="${#authentication.principal.username}">Admin</span>
            </div>
            <div class="header_img" id="user-toggle">
                <i class='bx bx-user-circle' style="font-size: 1.8rem; color: var(--primary);"></i>
            </div>
            <div class="user_menu" id="user-menu">
                <a href="#">Profile</a>
                <a th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">Déconnexion</a>
                <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>
            </div>
        </div>
    </header>
    <div class="l-navbar" id="nav-bar">
        <nav class="nav">
            <div> 
                <a href="#" class="nav_logo"> 
                    <i class='bx bx-layer nav_logo-icon'></i> 
                    <span class="nav_logo-name">Admin Panel</span> 
                </a>
                <div class="nav_list"> 
                    <a th:href="@{/admin/home}" class="nav_link"> 
                        <i class='bx bx-grid-alt nav_icon'></i> 
                        <span class="nav_name">Tableau de bord</span> 
                    </a> 
                    <a th:href="@{/admin/user/list}" class="nav_link"> 
                        <i class='bx bx-user nav_icon'></i> 
                        <span class="nav_name">Annotateurs</span> 
                    </a>
                    <a th:href="@{/admin/dataset/list}" class="nav_link"> 
                        <i class='bx bx-data nav_icon'></i> 
                        <span class="nav_name">Datasets</span> 
                    </a>
                    <a th:href="@{/admin/statistics}" class="nav_link"> 
                        <i class='bx bx-bar-chart-alt-2 nav_icon'></i> 
                        <span class="nav_name">Statistiques</span> 
                    </a>
                </div>
            </div> 
            <a th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form2').submit();" class="nav_link"> 
                <i class='bx bx-log-out nav_icon'></i> 
                <span class="nav_name">Déconnexion</span>
                <form id="logout-form2" th:action="@{/logout}" method="post" style="display: none;"></form>
            </a>
        </nav>
    </div>
    
    <!--Container Main start-->
    <div class="container-main">
        <div layout:fragment="content1"></div>
    </div>

    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function(event) {
            // Sidebar toggle functionality
            const showNavbar = (toggleId, navId, bodyId, headerId) => {
                const toggle = document.getElementById(toggleId),
                nav = document.getElementById(navId),
                bodypd = document.getElementById(bodyId),
                headerpd = document.getElementById(headerId)
                
                // Validate that all variables exist
                if(toggle && nav && bodypd && headerpd){
                    toggle.addEventListener('click', () => {
                        // show navbar
                        nav.classList.toggle('show')
                        // change icon
                        toggle.classList.toggle('bx-x')
                        // add padding to body
                        bodypd.classList.toggle('body-pd')
                        // add padding to header
                        headerpd.classList.toggle('body-pd')
                    })
                }
            }
            
            showNavbar('header-toggle','nav-bar','body-pd','header')
            
            /*===== LINK ACTIVE =====*/
            const navLinks = document.querySelectorAll('.nav_link:not(.nav_logo)')
            
            // Set active link based on current URL
            function setActiveLink() {
                const currentPath = window.location.pathname;
                let bestMatch = null;
                let bestMatchLength = 0;

                navLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && currentPath.includes(href) && href.length > bestMatchLength) {
                        bestMatch = link;
                        bestMatchLength = href.length;
                    }
                    
                    // Handle exact matches first - they take priority
                    if (href === currentPath) {
                        bestMatch = link;
                        bestMatchLength = href.length;
                    }
                });

                // Add active class to the best match
                if (bestMatch) {
                    navLinks.forEach(l=> l.classList.remove('active'));
                    bestMatch.classList.add('active');
                } else if (currentPath === '/admin/home' || currentPath === '/admin/') {
                    // Default to dashboard if no match
                    document.querySelector('a[href="/admin/home"]')?.classList.add('active');
                }
            }
            
            // Set initial active state
            setActiveLink();
            
            // Toggle user menu
            const userToggle = document.getElementById('user-toggle');
            const userMenu = document.getElementById('user-menu');

            if (userToggle && userMenu) {
                userToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userMenu.style.display = userMenu.style.display === 'block' ? 'none' : 'block';
                });

                // Click outside to close user menu
                document.addEventListener('click', (e) => {
                    if (!userToggle.contains(e.target) && !userMenu.contains(e.target)) {
                        userMenu.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
