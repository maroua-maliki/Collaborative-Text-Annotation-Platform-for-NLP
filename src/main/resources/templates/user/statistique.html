<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Statistiques - Tableau de bord</title>
    <style>
        /* Styles globaux */
        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
        }

        .container {
            padding: 2rem 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* En-tête de page */
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .page-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            margin-right: 1rem;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }

        .page-title-icon i {
            font-size: 1.5rem;
        }

        .page-header h1 {
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
            font-size: 1.75rem;
        }

        /* Cartes de statistiques */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-item {
            background: var(--bg-card);
            border-radius: var(--border-radius-md);
            padding: 1.75rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.5rem 0;
            line-height: 1.2;
        }

        .stat-label {
            color: var(--text-medium);
            font-size: 1rem;
            font-weight: 500;
        }

        /* Cartes de graphiques */
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-md);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .stat-card-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .chart-title {
            color: var(--text-dark);
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .chart-subtitle {
            color: var(--text-medium);
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0;
        }

        .chart-container {
            position: relative;
            padding: 1.5rem;
            height: 320px;
            flex-grow: 1;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .chart-container {
                height: 280px;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .chart-container {
                height: 250px;
                padding: 1rem;
            }
            
            .stat-item {
                padding: 1.5rem 1rem;
            }
            
            .stat-value {
                font-size: 2rem;
            }

            
            .page-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
  <div layout:fragment="content1">
    <div class="container py-5">
      <div class="d-flex align-items-center mb-5">
        <div class="page-title-icon me-3">
          <i class='bx bx-bar-chart-alt-2 nav_icon'></i>
        </div>
        <h1 class="mb-0">Mes Statistiques</h1>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" th:text="${tachesEnCours}">0</div>
          <div class="stat-label">Tâches en cours</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" th:text="${tachesTerminees}">0</div>
          <div class="stat-label">Tâches terminées</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" th:text="${textesAnnotes}">0</div>
          <div class="stat-label">Textes annotés</div>
        </div>
      </div>

      <!-- Graphiques -->
      <div class="row">
        <div class="col-md-6 mb-4">
          <div class="stat-card h-100">
            <div class="stat-card-header">
              <h3 class="chart-title">Progression des annotations par Tâche</h3>
              <p class="chart-subtitle">Comparaison entre le nombre de textes et les annotations</p>
            </div>
            <div class="chart-container">
              <canvas id="tachesComparisonChart"></canvas>
            </div>
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <div class="stat-card h-100">
            <div class="stat-card-header">
              <h3 class="chart-title">Distribution des Classes</h3>
              <p class="chart-subtitle">Répartition de vos annotations par classe</p>
            </div>
            <div class="chart-container">
              <canvas id="pieChart"></canvas>
            </div>
          </div>
        </div>
      </div>

    <!-- Chargement de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
      // Récupération des données depuis le contrôleur
      const classesData = /*[[${classesData}]]*/ [];
      const classesLabels = /*[[${classesLabels}]]*/ [];
      const tachesData = /*[[${tachesData}]]*/ [];
      const tachesLabels = /*[[${tachesLabels}]]*/ [];
      const tachesTextesData = /*[[${tachesTextesData}]]*/ [];
      const tachesAnnotationsData = /*[[${tachesAnnotationsData}]]*/ [];

      // Palette de couleurs cohérente avec le design system
      const colorPalette = {
        primary: '#4361ee',
        secondary: '#7209b7',
        success: '#10b981',
        warning: '#f59e0b',
        error: '#ef4444',
        accent: '#4cc9f0',
        purple: '#6f42c1',
        teal: '#17a2b8'
      };

      document.addEventListener('DOMContentLoaded', function() {
        // Configuration commune pour les graphiques
        Chart.defaults.font.family = "'Outfit', sans-serif";
        Chart.defaults.color = '#6b7280';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(255, 255, 255, 0.9)';
        Chart.defaults.plugins.tooltip.titleColor = '#1f2937';
        Chart.defaults.plugins.tooltip.bodyColor = '#1f2937';
        Chart.defaults.plugins.tooltip.borderColor = 'rgba(0, 0, 0, 0.1)';
        Chart.defaults.plugins.tooltip.borderWidth = 1;
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.boxPadding = 6;

        // Graphique de comparaison des tâches
        if (document.getElementById('tachesComparisonChart') && tachesLabels.length > 0) {
          // Vérifier et formater les données
          const textesData = Array.from(tachesTextesData).map(Number);
          const annotationsData = Array.from(tachesAnnotationsData).map(Number);
          
          console.log('Labels des tâches:', tachesLabels);
          console.log('Textes disponibles:', textesData);
          console.log('Annotations effectuées:', annotationsData);

          new Chart(document.getElementById('tachesComparisonChart'), {
            type: 'bar',
            data: {
              labels: Array.from(tachesLabels),
              datasets: [
                {
                  label: 'Textes disponibles',
                  data: textesData,
                  backgroundColor: colorPalette.primary + '80', // Ajout de transparence
                  borderRadius: 4,
                  borderWidth: 0,
                  barPercentage: 0.5,
                  categoryPercentage: 0.8
                },
                {
                  label: 'Annotations effectuées',
                  data: annotationsData,
                  backgroundColor: colorPalette.secondary,
                  borderRadius: 4,
                  borderWidth: 0,
                  barPercentage: 0.5,
                  categoryPercentage: 0.8
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: 'index',
                intersect: false,
              },
              plugins: {
                legend: {
                  position: 'top',
                  labels: {
                    usePointStyle: true,
                    pointStyle: 'circle',
                    padding: 20,
                    color: 'var(--text-medium)'
                  }
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return `${context.dataset.label}: ${context.raw} (${Math.round((context.raw / textesData[context.dataIndex] * 100) || 0)}%)`;
                    }
                  }
                }
              },
              scales: {
                x: {
                  grid: {
                    display: false
                  },
                  ticks: {
                    color: 'var(--text-medium)'
                  }
                },
                y: {
                  beginAtZero: true,
                  grid: {
                    color: 'rgba(0, 0, 0, 0.05)'
                  },
                  ticks: {
                    color: 'var(--text-medium)'
                  }
                }
              }
            }
          });
        }

        // Graphique de distribution des classes
        if (document.getElementById('pieChart')) {
          new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: {
              labels: Array.from(classesLabels),
              datasets: [{
                data: Array.from(classesData),
                backgroundColor: [
                  colorPalette.primary,
                  colorPalette.secondary,
                  colorPalette.success,
                  colorPalette.warning,
                  colorPalette.accent,
                  colorPalette.purple,
                  colorPalette.teal
                ],
                borderWidth: 0,
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'right',
                  labels: {
                    padding: 20,
                    usePointStyle: true,
                    pointStyle: 'circle'
                  }
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      const label = context.label || '';
                      const value = context.raw || 0;
                      const total = context.dataset.data.reduce((a, b) => a + b, 0);
                      const percentage = Math.round((value / total) * 100);
                      return `${label}: ${value} (${percentage}%)`;
                    }
                  }
                }
              },
              cutout: '60%'
            }
          });
        }
      });
    </script>
  </div>
</body>
</html>
