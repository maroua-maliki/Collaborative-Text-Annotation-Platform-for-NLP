<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Utilisateur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Styles conservés mais sans modification des éléments de navigation -->
    <style>
        .welcome-card {
            border: none;
            background: linear-gradient(135deg, var(--primary-light) 0%, rgba(76, 201, 240, 0.2) 100%);
            margin-bottom: 1.5rem;
        }

        .welcome-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .welcome-subtitle {
            color: var(--text-medium);
        }

        /* Stat Cards */
        .stat-card {
            height: 100%;
            border: none;
            transition: all var(--transition-fast) ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-title {
            font-size: 0.9rem;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0;
            color: var(--text-dark);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .task-icon {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .complete-icon {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        .text-icon {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stat-progress {
            height: 8px;
            border-radius: 4px;
            background-color: var(--bg-sidebar);
            overflow: hidden;
        }

        .stat-progress .progress-bar {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div layout:fragment="content1">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card welcome-card">
                <div class="card-body d-flex align-items-center p-4">
                    <div class="welcome-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="welcome-content ms-4">
                        <h2 class="welcome-title mb-1">Bienvenue, <span th:text="${#authentication.principal.username}">Utilisateur</span></h2>
                        <p class="welcome-subtitle mb-0">Votre espace d'annotation personnel vous attend</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3 mb-md-0">
            <div class="card stat-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="stat-title">Tâches en cours</h6>
                            <h3 class="stat-value" th:text="${tachesEnCours ?: '0'}">0</h3>
                        </div>
                        <div class="stat-icon task-icon">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                    </div>
                    <div class="progress stat-progress mt-3">
                        <div class="progress-bar" role="progressbar" th:style="'width: ' + ${tachesEnCoursPct ?: '40'} + '%'" style="width: 40%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3 mb-md-0">
            <div class="card stat-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="stat-title">Tâches terminées</h6>
                            <h3 class="stat-value" th:text="${tachesTerminees ?: '0'}">0</h3>
                        </div>
                        <div class="stat-icon complete-icon">
                            <i class="bi bi-check-circle"></i>
                        </div>
                    </div>
                    <div class="progress stat-progress mt-3">
                        <div class="progress-bar" role="progressbar" th:style="'width: ' + ${tachesCompletePct ?: '70'} + '%'" style="width: 70%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="stat-title">Textes annotés</h6>
                            <h3 class="stat-value" th:text="${textesAnnotes ?: '0'}">0</h3>
                        </div>
                        <div class="stat-icon text-icon">
                            <i class="bi bi-file-earmark-text"></i>
                        </div>
                    </div>
                    <div class="progress stat-progress mt-3">
                        <div class="progress-bar" role="progressbar" th:style="'width: ' + ${tauxAnnotationGlobal ?: '55'} + '%'" style="width: 55%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Welcome Section, Stats Cards, etc. -->
</div>
<!-- Suppression du script qui interfère avec la sidebar -->
</body>
</html>
