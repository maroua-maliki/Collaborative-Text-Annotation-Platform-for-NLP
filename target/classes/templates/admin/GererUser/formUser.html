<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Annotateur</title>
    <style>
        /* Animation */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeSlideIn 0.6s ease forwards;
        }
        
        /* Form container */
        .form-container {
            padding: 1.5rem;
            max-width: 100%;
            margin: 0 auto;
            animation: fadeSlideIn 0.6s ease forwards;
        }
        
        /* Form card */
        .form-card {
            background-color: var(--bg-card);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(10px);
            overflow: hidden;
            transition: all var(--transition-fast) ease;
        }
        
        /* Form header */
        .form-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(156, 163, 175, 0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .form-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        
        .form-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        /* Form content */
        .form-body {
            padding: 2rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.95rem;
        }
        
        .required::after {
            content: " *";
            color: var(--error);
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--glass-border);
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            transition: all var(--transition-fast) ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }
        
        .input-group {
            display: flex;
            align-items: stretch;
        }
        
        .input-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            border-top-left-radius: var(--border-radius-sm);
            border-bottom-left-radius: var(--border-radius-sm);
            border: 1px solid var(--glass-border);
            border-right: none;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.1), rgba(58, 12, 163, 0.05));
            color: var(--primary);
        }
        
        .input-group .form-control {
            flex: 1;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        
        .form-helper {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.85rem;
            color: var(--text-medium);
            margin-top: 0.5rem;
        }
        
        .error-feedback {
            font-size: 0.85rem;
            color: var(--error);
            margin-top: 0.5rem;
        }
        
        /* Form actions */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all var(--transition-fast) ease;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        
        .btn-back {
            color: var(--text-medium);
            background-color: transparent;
            border: 1px solid var(--glass-border);
        }
        
        .btn-back:hover {
            background-color: var(--bg-sidebar-hover);
            color: var(--text-dark);
        }
        
        .btn-submit {
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 3px 10px rgba(67, 97, 238, 0.2);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
    </style>
</head>
<body>
<div layout:fragment="content1">
    <div class="form-container animate-fade-in">
        <div class="row justify-content-center">
            <div class="col-xl-8 col-lg-10 col-md-12">
                <div class="form-card">
                    <div class="form-header">
                        <div class="form-icon">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h3 class="form-title">Ajouter un nouvel annotateur</h3>
                    </div>
                    
                    <div class="form-body">
                        <form method="post" th:action="@{/admin/user/save}" class="needs-validation" novalidate>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="nom" class="form-label required">Nom</label>
                                    <input id="nom" type="text" name="nom" class="form-control"
                                           th:value="${annotateur.nom}" required>
                                    <div class="error-feedback" th:if="${#fields.hasErrors('annotateur.nom')}"
                                         th:errors="${annotateur.nom}"></div>
                                </div>
                                
                                <div class="form-group">
                                    <label for="prenom" class="form-label required">Prénom</label>
                                    <input id="prenom" type="text" name="prenom" class="form-control"
                                           th:value="${annotateur.prenom}" required>
                                    <div class="error-feedback" th:if="${#fields.hasErrors('annotateur.prenom')}"
                                         th:errors="${annotateur.prenom}"></div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="email" class="form-label required">Email</label>
                                <div class="input-group">
                                    <div class="input-icon">
                                        <i class="bi bi-envelope"></i>
                                    </div>
                                    <input id="email" type="email" name="email" class="form-control"
                                           th:value="${annotateur.email}" required>
                                </div>
                                <div class="error-feedback" th:if="${#fields.hasErrors('annotateur.email')}"
                                     th:errors="${annotateur.email}"></div>
                                <div class="form-helper">
                                    <i class="bi bi-info-circle"></i>
                                    <span>Le mot de passe sera envoyé à cette adresse email.</span>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="login" class="form-label required">Login</label>
                                <div class="input-group">
                                    <div class="input-icon">
                                        <i class="bi bi-person"></i>
                                    </div>
                                    <input id="login" type="text" name="login" class="form-control"
                                           th:value="${annotateur.login}" required>
                                </div>
                                <div class="error-feedback" th:if="${#fields.hasErrors('annotateur.login')}"
                                     th:errors="${annotateur.login}"></div>
                                <div class="form-helper">
                                    <i class="bi bi-info-circle"></i>
                                    <span>Ce login sera utilisé pour la connexion à la plateforme.</span>
                                </div>
                            </div>
                            
                            <div class="form-actions">
                                <a th:href="@{/admin/user/list}" class="btn btn-back">
                                    <i class="bi bi-arrow-left"></i>
                                    <span>Retour</span>
                                </a>
                                <button type="submit" class="btn btn-submit">
                                    <i class="bi bi-save"></i>
                                    <span>Enregistrer</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
