<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Statistiques - Tableau de bord</title>
    <style>
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            transition: transform var(--transition-fast) ease, box-shadow var(--transition-fast) ease;
            backdrop-filter: blur(var(--backdrop-blur));
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.1);
        }
        
        .stat-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(156, 163, 175, 0.1);
        }
        
        .chart-title {
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .chart-subtitle {
            color: var(--text-medium);
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        
        .chart-container {
            position: relative;
            padding: 1.5rem;
            height: 300px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .stat-item {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0.5rem 0;
            line-height: 1.2;
        }
        
        .stat-label {
            color: var(--text-medium);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
  <div layout:fragment="content1">
    <div class="container py-5">
      <div class="d-flex align-items-center mb-5">
        <div class="page-title-icon me-3">
          <i class='bx bx-bar-chart-alt-2 nav_icon'></i>
        </div>
        <h1 class="mb-0">Mes Statistiques</h1>
      </div>
      
      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" th:text="${tachesEnCours}">0</div>
          <div class="stat-label">Tâches en cours</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" th:text="${tachesTerminees}">0</div>
          <div class="stat-label">Tâches terminées</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" th:text="${textesAnnotes}">0</div>
          <div class="stat-label">Textes annotés</div>
        </div>
      </div>
      
      <!-- Graphiques -->
      <div class="stats-grid">
        <!-- Distribution des Classes -->
        <div class="stat-card">
          <div class="stat-card-header">
            <h3 class="chart-title">Distribution des Classes</h3>
            <p class="chart-subtitle">Répartition de vos annotations par classe</p>
          </div>
          <div class="chart-container">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
        
        <!-- Progression par Tâche -->
        <div class="stat-card">
          <div class="stat-card-header">
            <h3 class="chart-title">Progression par Tâche</h3>
            <p class="chart-subtitle">Pourcentage d'achèvement de vos tâches</p>
          </div>
          <div class="chart-container">
            <canvas id="barChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Chargement de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
      // Récupération des données depuis le contrôleur
      const classesData = /*[[${classesData}]]*/ [];
      const classesLabels = /*[[${classesLabels}]]*/ [];
      const tachesData = /*[[${tachesData}]]*/ [];
      const tachesLabels = /*[[${tachesLabels}]]*/ [];

      // Palette de couleurs cohérente avec le design system
      const colorPalette = {
        primary: '#4361ee',
        secondary: '#7209b7',
        success: '#10b981',
        warning: '#f59e0b',
        error: '#ef4444',
        accent: '#4cc9f0',
        purple: '#6f42c1',
        teal: '#17a2b8'
      };

      document.addEventListener('DOMContentLoaded', function() {
        // Configuration commune pour les graphiques
        Chart.defaults.font.family = "'Outfit', sans-serif";
        Chart.defaults.color = '#6b7280';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(255, 255, 255, 0.9)';
        Chart.defaults.plugins.tooltip.titleColor = '#1f2937';
        Chart.defaults.plugins.tooltip.bodyColor = '#1f2937';
        Chart.defaults.plugins.tooltip.borderColor = 'rgba(0, 0, 0, 0.1)';
        Chart.defaults.plugins.tooltip.borderWidth = 1;
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.boxPadding = 6;

        // Graphique de distribution des classes
        if (document.getElementById('pieChart')) {
          new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: {
              labels: Array.from(classesLabels),
              datasets: [{
                data: Array.from(classesData),
                backgroundColor: [
                  colorPalette.primary,
                  colorPalette.secondary,
                  colorPalette.success,
                  colorPalette.warning,
                  colorPalette.accent,
                  colorPalette.purple,
                  colorPalette.teal
                ],
                borderWidth: 0,
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'right',
                  labels: {
                    padding: 20,
                    usePointStyle: true,
                    pointStyle: 'circle'
                  }
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      const label = context.label || '';
                      const value = context.raw || 0;
                      const total = context.dataset.data.reduce((a, b) => a + b, 0);
                      const percentage = Math.round((value / total) * 100);
                      return `${label}: ${value} (${percentage}%)`;
                    }
                  }
                }
              },
              cutout: '60%'
            }
          });
        }

        // Graphique de progression par tâche
        if (document.getElementById('barChart')) {
          new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
              labels: Array.from(tachesLabels),
              datasets: [{
                label: 'Progression (%)',
                data: Array.from(tachesData),
                backgroundColor: colorPalette.primary,
                borderRadius: 6,
                borderWidth: 0,
                barPercentage: 0.7
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return context.raw + '% complété';
                    }
                  }
                }
              },
              scales: {
                x: {
                  beginAtZero: true,
                  max: 100,
                  grid: {
                    color: 'rgba(107, 114, 128, 0.1)'
                  },
                  ticks: {
                    callback: function(value) {
                      return value + '%';
                    }
                  }
                },
                y: {
                  grid: {
                    display: false
                  }
                }
              }
            }
          });
        }
      });
    </script>
  </div>
</body>
</html>
