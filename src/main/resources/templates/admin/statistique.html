<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - Tableau de bord</title>
    <style>
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            transition: transform var(--transition-fast) ease, box-shadow var(--transition-fast) ease;
            backdrop-filter: blur(var(--backdrop-blur));
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.1);
        }
        
        .stat-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(156, 163, 175, 0.1);
        }
        
        .chart-title {
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .chart-subtitle {
            color: var(--text-medium);
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        
        .chart-container {
            position: relative;
            padding: 1.5rem;
            height: 300px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        /* Page title icon styling - matching other pages */
        .page-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: #4a6cf7;
            color: white;
            border-radius: 12px;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(74, 108, 247, 0.25);
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
  <div layout:fragment="content1">
    <div class="container py-5">
      <div class="d-flex align-items-center mb-5">
        <div class="page-title-icon me-3">
          <i class='bx bx-bar-chart-alt-2 nav_icon'></i>
        </div>
        <h1 class="mb-0">Statistique</h1>
      </div>
      
      <!-- Stats Grid Layout -->
      <div class="stats-grid mb-5">
        <!-- Diagramme pour les datasets -->
        <div class="stat-card">
          <div class="stat-card-header">
            <h3 class="chart-title">Progression des annotations par Dataset</h3>
            <p class="chart-subtitle">Comparaison entre le nombre de paires de texte et les annotations</p>
          </div>
          <div class="chart-container">
            <canvas id="datasetComparisonChart"></canvas>
          </div>
        </div>
        
        <!-- Distribution des Classes -->
        <div class="stat-card">
          <div class="stat-card-header">
            <h3 class="chart-title">Distribution des Classes</h3>
            <p class="chart-subtitle">Répartition des annotations par classe</p>
          </div>
          <div class="chart-container">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </div>
      
      <!-- Additional Chart Section -->
      <div class="stat-card mb-5">
        <div class="stat-card-header">
          <h3 class="chart-title">Performance des Annotateurs</h3>
          <p class="chart-subtitle">Nombre d'annotations par annotateur</p>
        </div>
        <div class="chart-container">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Chargement de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
      // Récupération des données depuis le contrôleur
      const datasetsData = /*[[${datasetsData}]]*/ [];
      const datasetsLabels = /*[[${datasetsLabels}]]*/ [];
      const totalPairsData = /*[[${totalPairsData}]]*/ [];
      const classesData = /*[[${classesData}]]*/ [];
      const classesLabels = /*[[${classesLabels}]]*/ [];
      const annotateursLabels = /*[[${annotateursLabels}]]*/ [];
      const annotateursData = /*[[${annotateursData}]]*/ [];

      // Palette de couleurs cohérente avec le design system
      const colorPalette = {
        primary: '#4361ee',
        secondary: '#10b981',
        success: '#10b981',
        warning: '#f59e0b',
        error: '#ef4444',
        accent: '#4cc9f0',
        purple: '#6f42c1',
        teal: '#17a2b8'
      };

      document.addEventListener('DOMContentLoaded', function() {
        // Configuration commune pour les graphiques
        Chart.defaults.font.family = "'Outfit', sans-serif";
        Chart.defaults.color = '#6b7280';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(255, 255, 255, 0.9)';
        Chart.defaults.plugins.tooltip.titleColor = '#1f2937';
        Chart.defaults.plugins.tooltip.bodyColor = '#1f2937';
        Chart.defaults.plugins.tooltip.borderColor = 'rgba(0, 0, 0, 0.1)';
        Chart.defaults.plugins.tooltip.borderWidth = 1;
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.boxPadding = 6;

        // Graphique de comparaison datasets
        new Chart(document.getElementById('datasetComparisonChart'), {
          type: 'bar',
          data: {
            labels: datasetsLabels,
            datasets: [
              {
                label: 'Paires de texte',
                data: totalPairsData,
                backgroundColor: colorPalette.primary,
                borderRadius: 4,
                borderWidth: 0,
                barPercentage: 0.4
              },
              {
                label: 'Annotations',
                data: datasetsData,
                backgroundColor: colorPalette.secondary,
                borderRadius: 4,
                borderWidth: 0,
                barPercentage: 0.4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { 
                position: 'top',
                labels: {
                  usePointStyle: true,
                  pointStyle: 'circle',
                  padding: 20
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.dataset.label + ': ' + context.raw;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: {
                  color: 'rgba(107, 114, 128, 0.1)'
                },
                title: {
                  display: true,
                  text: 'Nombre'
                }
              },
              x: {
                grid: {
                  display: false
                }
              }
            },
            // Espacement entre les groupes de barres
            barPercentage: 0.8,
            categoryPercentage: 0.8
          }
        });

        // Graphique de distribution des classes
        new Chart(document.getElementById('pieChart'), {
          type: 'doughnut',
          data: {
            labels: classesLabels,
            datasets: [{
              data: classesData,
              backgroundColor: [
                colorPalette.primary,    // Bleu
                colorPalette.secondary,  // Vert
                colorPalette.warning,    // Jaune
                colorPalette.purple,     // Violet
                '#20c9a6',  // Turquoise clair
                '#0d6efd'   // Bleu vif
              ],
              borderWidth: 1,
              borderColor: '#fff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  padding: 15,
                  usePointStyle: true,
                  pointStyle: 'circle',
                  font: {
                    size: 11
                  }
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const label = context.label || '';
                    const value = context.raw || 0;
                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                    const percentage = Math.round((value / total) * 100);
                    return `${label}: ${value} annotations (${percentage}%)`;
                  }
                }
              }
            },
            cutout: '60%',
            layout: {
              padding: 10
            }
          }
        });

        // Graphique des performances des annotateurs (barres verticales)
        new Chart(document.getElementById('lineChart'), {
          type: 'bar',
          data: {
            labels: annotateursLabels,
            datasets: [{
              label: 'Annotations',
              data: annotateursData,
              backgroundColor: colorPalette.primary,
              borderRadius: 6,
              borderWidth: 0
            }]
          },
          options: {
            indexAxis: 'x', // Changer de 'y' à 'x' pour des barres verticales
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.raw + ' annotations';
                  }
                }
              }
            },
            scales: {
              y: { // Maintenant l'axe Y représente le nombre d'annotations
                beginAtZero: true,
                grid: {
                  color: 'rgba(107, 114, 128, 0.1)'
                }
              },
              x: { // L'axe X représente les annotateurs
                grid: {
                  display: false
                }
              }
            }
          }
        });
      });
    </script>
  </div>
</body>
</html>
