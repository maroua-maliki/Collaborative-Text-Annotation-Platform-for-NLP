<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - Tableau de bord</title>
</head>
<body>
  <div layout:fragment="content1">
    <div class="container py-5">
      <h1 class="mb-5 text-center">Statistiques Générales</h1>
      <div class="row g-4">
        <!-- Évolution des annotations -->
        <div class="col-lg-4 col-md-6">
          <div class="stat-card">
            <div class="chart-title">Évolution des Annotations</div>
            <canvas id="lineChart"></canvas>
          </div>
        </div>
        <!-- Répartition par Dataset -->
        <div class="col-lg-4 col-md-6">
          <div class="stat-card">
            <div class="chart-title">Répartition par Dataset</div>
            <canvas id="barChart"></canvas>
          </div>
        </div>
        <!-- Distribution des Classes -->
        <div class="col-lg-4 col-md-12">
          <div class="stat-card">
            <div class="chart-title">Distribution des Classes</div>
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Chargement de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
      // Récupération des données depuis le contrôleur
      const annotationsParMois = /*[[${annotationsParMois}]]*/ [];
      const datasetsData = /*[[${datasetsData}]]*/ [];
      const datasetsLabels = /*[[${datasetsLabels}]]*/ [];
      const classesData = /*[[${classesData}]]*/ [];
      const classesLabels = /*[[${classesLabels}]]*/ [];
      
      document.addEventListener('DOMContentLoaded', function() {
        // Graphique d'évolution des annotations
        new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
            labels: ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'],
            datasets: [{
              label: 'Annotations par mois',
              data: annotationsParMois,
              borderColor: '#007bff',
              backgroundColor: 'rgba(0,123,255,0.1)',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.raw + ' annotations';
                  }
                }
              }
            }
          }
        });
        
        // Graphique de répartition par dataset
        new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: {
            labels: datasetsLabels,
            datasets: [{
              label: 'Textes annotés',
              data: datasetsData,
              backgroundColor: ['#28a745', '#ffc107', '#dc3545', '#17a2b8', '#6610f2']
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.raw + ' textes annotés';
                  }
                }
              }
            }
          }
        });
        
        // Graphique de distribution des classes
        new Chart(document.getElementById('pieChart'), {
          type: 'pie',
          data: {
            labels: classesLabels,
            datasets: [{
              data: classesData,
              backgroundColor: ['#007bff', '#ffc107', '#dc3545', '#28a745', '#6f42c1']
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: 'bottom',
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.raw + ' annotations';
                  }
                }
              }
            }
          }
        });
      });
    </script>
  </div>
</body>
</html>
