<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Plateforme d'Annotation</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --primary-light: #eef2ff;
            --secondary: #7209b7;
            --accent: #4cc9f0;
            --success: #10b981;
            --error: #ef4444;
            --text-dark: #1f2937;
            --text-medium: #6b7280;
            --text-light: #9ca3af;
            --background: #f9fafb;
            --white: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--background);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(67, 97, 238, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(114, 9, 183, 0.1), transparent 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="12" cy="12" r="1.5" fill="%234361ee" opacity="0.1"/></svg>');
            background-size: 50px;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 2rem 0;
            z-index: 1;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            position: relative;
            border: 1px solid var(--glass-border);
        }

        .login-header {
            padding: 2.5rem 2.5rem 1.5rem;
            position: relative;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 1.5rem;
        }

        .login-header h1 {
            font-size: 2rem;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-medium);
            font-size: 1.05rem;
        }

        .login-body {
            padding: 1rem 2.5rem 2.5rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
            position: relative;
        }

        .form-control {
            width: 100%;
            height: 60px;
            padding: 0 1.25rem 0 3.5rem;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(156, 163, 175, 0.1);
            border-radius: 16px;
            color: var(--text-dark);
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .form-control:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
            outline: none;
        }

        .form-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 3.5rem;
            color: var(--text-light);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-control:focus ~ .form-label,
        .form-control:not(:placeholder-shown) ~ .form-label {
            top: -12px;
            left: 1.25rem;
            font-size: 0.8rem;
            padding: 0 0.5rem;
            background: var(--white);
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.03em;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.05);
        }

        .form-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .form-control:focus ~ .form-icon {
            color: var(--primary);
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 2rem;
        }

        .forgot-password a {
            color: var(--text-medium);
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--primary);
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 16px;
            color: var(--white);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0 1.5rem;
            box-shadow: 0 8px 16px rgba(67, 97, 238, 0.15);
            position: relative;
            overflow: hidden;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .login-button:hover {
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.25);
            transform: translateY(-2px);
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button i {
            font-size: 1.25rem;
            transition: all 0.3s ease;
        }

        .login-button:hover i {
            transform: translateX(4px);
        }

        .alert {
            border-radius: 14px;
            margin-bottom: 1.75rem;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            position: relative;
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
        }

        .alert i {
            font-size: 1.25rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.08);
            color: var(--error);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.08);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-header {
                padding: 2rem 1.5rem 1rem;
            }

            .login-body {
                padding: 0.5rem 1.5rem 2rem;
            }

            .login-header h1 {
                font-size: 1.75rem;
            }
        }

        /* Animation effects */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .brand-logo {
            animation: floatIn 0.4s ease-out forwards;
        }

        .login-header h1 {
            animation: floatIn 0.5s 0.1s ease-out both;
        }

        .login-header p {
            animation: floatIn 0.5s 0.2s ease-out both;
        }

        .form-group:nth-child(1) {
            animation: floatIn 0.5s 0.3s ease-out both;
        }

        .form-group:nth-child(2) {
            animation: floatIn 0.5s 0.4s ease-out both;
        }

        .forgot-password {
            animation: floatIn 0.5s 0.5s ease-out both;
        }

        .login-button {
            animation: floatIn 0.5s 0.6s ease-out both;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>Bienvenue</h1>
            <p>Connectez-vous pour accéder à votre espace d'annotation</p>
        </div>
        <div class="login-body">
            <form th:method="post" th:action="@{/login}" autocomplete="off">
                <div class="form-group">
                    <input type="text" class="form-control" id="log-email" name="username" placeholder=" " required>
                    <label for="log-email" class="form-label">Nom d'utilisateur</label>
                    <i class="bi bi-person-fill form-icon"></i>
                </div>
                
                <div class="form-group">
                    <input type="password" class="form-control" id="log-pass" name="password" placeholder=" " required>
                    <label for="log-pass" class="form-label">Mot de passe</label>
                    <i class="bi bi-lock-fill form-icon"></i>
                </div>
                
                <div class="forgot-password">
                    <a href="#">Mot de passe oublié?</a>
                </div>
                
                <!-- Error and success messages -->
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-circle"></i>
                    <span th:text="${session.error != null ? session.error : 'Invalid username or password'}"></span>
                </div>
                
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    <i class="bi bi-check-circle"></i>
                    <span>Vous avez été déconnecté avec succès.</span>
                </div>
                
                <button type="submit" class="login-button" id="SignInBtn">
                    Se connecter <i class="bi bi-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
