<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Datasets</title>
    <style>
        /* Page container */
        .page-container {
            padding: 2rem 0;
        }
        
        /* Page header */
        .page-header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .page-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: #4a6cf7;
            color: white;
            border-radius: 12px;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(74, 108, 247, 0.25);
        }
        
        /* Add dataset button */
        .btn-add-dataset {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.65rem 1.25rem;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(74, 108, 247, 0.25);
        }
        
        .btn-add-dataset:hover {
            background: #3655d5;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(74, 108, 247, 0.35);
        }
        
        /* Dataset cards container */
        .dataset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        /* Dataset card */
        .dataset-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            border: 1px solid #f1f1f1;
        }
        
        .dataset-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-color: #e2e8f0;
        }
        
        .dataset-card-header {
            padding: 1.5rem;
            border-bottom: 1px solid #f7f7f7;
        }
        
        .dataset-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.75rem;
            display: block;
        }
        
        /* Progress section */
        .progress-section {
            padding: 1.25rem 1.5rem;
            flex-grow: 1;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }
        
        .progress-percentage {
            font-weight: 700;
            color: #4a6cf7;
        }
        
        .progress-bar-container {
            height: 10px;
            background: #f1f5f9;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a6cf7, #818cf8);
            border-radius: 5px;
            transition: width 0.5s ease-out;
        }
        
        .progress-stats {
            display: flex;
            gap: 0.5rem;
            font-size: 0.8125rem;
            color: #64748b;
        }
        
        .progress-stats span {
            padding: 0.25rem 0.5rem;
            background: #f8fafc;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        
        .progress-stats i {
            color: #4a6cf7;
            font-size: 0.875rem;
        }
        
        /* Actions footer */
        .card-actions {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
        }
        
        .btn-card-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            color: white;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .btn-card-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn-view {
            background: #4a6cf7;
        }
        
        .btn-add-user {
            background: #10b981;
        }
        
        .btn-delete {
            background: #ef4444;
        }
        
        /* Empty state */
        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .empty-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: #f1f5f9;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            color: #94a3b8;
        }
        
        .empty-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.5rem;
        }
        
        .empty-description {
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        
        /* Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .dataset-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .btn-add-dataset {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content1">
    <div class="container py-4">
        <div class="page-container animate-fade-up">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title">
                    <div class="page-title-icon">
                        <i class="bi bi-database-fill"></i>
                    </div>
                    <span>Liste des Datasets</span>
                </div>
                <a href="/admin/dataset/ajouter" class="btn-add-dataset">
                    <i class="bi bi-plus-lg"></i>
                    <span>Nouveau Dataset</span>
                </a>
            </div>
            
            <!-- Dataset Grid -->
            <div class="dataset-grid">
                <!-- Empty State -->
                <div class="empty-state" th:if="${#lists.isEmpty(datasetsInfo)}" style="grid-column: 1 / -1;">
                    <div class="empty-icon">
                        <i class="bi bi-database-x"></i>
                    </div>
                    <h3 class="empty-title">Aucun dataset disponible</h3>
                    <p class="empty-description">Créez votre premier dataset pour commencer à gérer vos annotations.</p>
                    <a href="/admin/dataset/ajouter" class="btn-add-dataset">
                        <i class="bi bi-plus-lg"></i>
                        <span>Créer un Dataset</span>
                    </a>
                </div>
                
                <!-- Dataset Cards -->
                <div class="dataset-card" th:each="datasetInfo : ${datasetsInfo}">
                    <div class="dataset-card-header">
                        <span class="dataset-name" th:text="${datasetInfo.dataset.nomDataset}"></span>
                    </div>
                    
                    <div class="progress-section">
                        <div class="progress-label">
                            <span>Avancement</span>
                            <span class="progress-percentage" th:text="${datasetInfo.pourcentage} + '%'"></span>
                        </div>
                        
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" 
                                 th:style="'width: ' + ${datasetInfo.pourcentage} + '%'">
                            </div>
                        </div>
                        
                        <div class="progress-stats">
                            <span>
                                <i class="bi bi-check2-circle"></i>
                                <span th:text="${datasetInfo.textesAnnotes} + ' annotés'"></span>
                            </span>
                            <span>
                                <i class="bi bi-collection"></i>
                                <span th:text="${datasetInfo.totalTextes} + ' total'"></span>
                            </span>
                        </div>
                    </div>
                    
                    <div class="card-actions">
                        <a th:href="@{/admin/dataset/{id}(id=${datasetInfo.dataset.id})}" 
                           class="btn-card-action btn-view" title="Détails">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:if="${datasetInfo.dataset.taches == null || datasetInfo.dataset.taches.isEmpty()}"
                           th:href="@{/admin/dataset/ajouter-annotateur/{id}(id=${datasetInfo.dataset.id})}"
                           class="btn-card-action btn-add-user" title="Ajouter annotateur">
                            <i class="bi bi-person-plus"></i>
                        </a>
                        <a onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce dataset?')"
                           th:href="@{/admin/dataset/delete/{id}(id=${datasetInfo.dataset.id})}"
                           class="btn-card-action btn-delete" title="Supprimer">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
