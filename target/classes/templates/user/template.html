<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme d'Annotation</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap");
        :root{
            --header-height: 3rem;
            --nav-width: 68px;
            --first-color: #4361ee;
            --first-color-light: #AFA5D9;
            --white-color: #F7F6FB;
            --body-font: 'Nunito', sans-serif;
            --normal-font-size: 1rem;
            --z-fixed: 100;
            
            /* Keeping some of your existing variables */
            --primary: #4361ee;
            --primary-light: #eef2ff;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #4cc9f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --text-dark: #1f2937;
            --text-medium: #6b7280;
            --text-light: #9ca3af;
            --bg-card: rgba(255, 255, 255, 0.8);
        }
        
        *,::before,::after{
            box-sizing: border-box}
        body{
            position: relative;
            margin: var(--header-height) 0 0 0;
            padding: 0 1rem;
            font-family: var(--body-font);
            font-size: var(--normal-font-size);
            transition: .5s}
        a{
            text-decoration: none}
        .header{
                width: 100%;height: var(--header-height);
                position: fixed;top: 0;left: 0;display: flex;
                align-items: center;justify-content: space-between;
                padding: 0 1rem;background-color: var(--white-color);
                z-index: var(--z-fixed);transition: .5s}
        .header_toggle{
                color: var(--first-color);
                font-size: 1.5rem;cursor: pointer}
        .header_img{
                width: 35px;
                height: 35px;
                display: flex;
                justify-content: center;
                border-radius: 50%;
                overflow: hidden}
        .header_img img{
                width: 40px}
        .l-navbar{
                position: fixed;
                top: 0;
                left: -30%;
                width: var(--nav-width);
                height: 100vh;
                background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
                padding: .5rem 1rem 0 0;
                transition: .5s;
                z-index: var(--z-fixed)}
        .nav{
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden}
        .nav_logo, .nav_link{
                display: grid;
                grid-template-columns: max-content max-content;
                align-items: center;
                column-gap: 1rem;
                padding: .5rem 0 .5rem 1.5rem}
        .nav_logo{
                margin-bottom: 2rem}
        .nav_logo-icon{
                    font-size: 1.25rem;
                    color: var(--white-color)}
        .nav_logo-name{
                    color: var(--white-color);
                    font-weight: 700}
        .nav_link{
                    position: relative;
                    color: var(--first-color-light);
                    margin-bottom: 1.5rem;
                    transition: .3s}
        .nav_link:hover{
                    color: var(--white-color)}
        .nav_icon{
            font-size: 1.25rem}
        .show{
            left: 0}
        .body-pd{
            padding-left: calc(var(--nav-width) + 1rem)}
        .active{
            color: var(--white-color)}
        .active::before{
            content: '';
            position: absolute;
            left: 0;
            width: 2px;
            height: 32px;
            background-color: var(--white-color)}
        .height-100{
            height:100vh}
        @media screen and (min-width: 768px){
            body{
                margin: calc(var(--header-height) + 1rem) 0 0 0;
                padding-left: calc(var(--nav-width) + 2rem)
            }
            .header{
                height: calc(var(--header-height) + 1rem);
                padding: 0 2rem 0 calc(var(--nav-width) + 2rem)
            }
            .header_img{
                width: 40px;
                height: 40px
            }
            .header_img img{
                width: 45px
            }
            .l-navbar{
                left: 0;
                padding: 1rem 1rem 0 0
            }
            .show{
                width: calc(var(--nav-width) + 156px)
            }
            .body-pd{
                padding-left: calc(var(--nav-width) + 188px)
            }
        }
        
        .header_user {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .user_menu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background: white;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            border-radius: 5px;
            overflow: hidden;
            z-index: 999;
        }

        .user_menu a {
            display: block;
            padding: 10px 20px;
            color: #333;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.3s;
        }

        .user_menu a:hover {
            background: #f0f0f0;
        }
        
        /* Container for main content */
        .container-main {
            padding: 20px;
            margin-top: 20px;
        }

        /* User info styles */
        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .header_user {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .header_img {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: var(--bg-sidebar-hover);
        }
    </style>
</head>
<body id="body-pd">
    <header class="header" id="header">
        <div class="header_toggle"> <i class='bx bx-menu' id="header-toggle"></i> </div>
        <div class="header_user">
            <div class="user-info d-none d-md-block me-3">
                <span class="user-name" th:text="${#authentication.principal.username}">User</span>
            </div>
            <div class="header_img" id="user-toggle">
                <i class='bx bx-user-circle' style="font-size: 1.8rem; color: var(--primary);"></i>
            </div>
            <div class="user_menu" id="user-menu">
                <a href="#">Profile</a>
                <a th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form2').submit();">Déconnexion</a>
                <form id="logout-form2" th:action="@{/logout}" method="post" style="display: none;"></form>
            </div>
        </div>
    </header>
    
    <div class="l-navbar" id="nav-bar">
        <nav class="nav">
            <div>
                <a href="#" class="nav_logo">
                    <i class='bx bx-layer nav_logo-icon'></i>
                    <span class="nav_logo-name">Annotation</span>
                </a>
                <div class="nav_list">
                    <a th:href="@{/user/home}" class="nav_link active">
                        <i class='bx bx-grid-alt nav_icon'></i>
                        <span class="nav_name">Tableau de bord</span>
                    </a>
                    <a th:href="@{/user/tache/list}" class="nav_link">
                        <i class='bx bx-folder nav_icon'></i>
                        <span class="nav_name">Tâches</span>
                    </a>
                </div>
            </div>
            <a th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();" class="nav_link">
                <i class='bx bx-log-out nav_icon'></i>
                <span class="nav_name">Déconnexion</span>
            </a>
            <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>
        </nav>
    </div>
    
    <!--Container Main start-->
    <div class="container-main">
        <div layout:fragment="content1"></div>
    </div>

    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Sidebar toggle functionality
            const showNavbar = (toggleId, navId, bodyId, headerId) => {
                const toggle = document.getElementById(toggleId),
                nav = document.getElementById(navId),
                bodypd = document.getElementById(bodyId),
                headerpd = document.getElementById(headerId)
                
                // Validate that all variables exist
                if(toggle && nav && bodypd && headerpd){
                    toggle.addEventListener('click', () => {
                        // show navbar
                        nav.classList.toggle('show')
                        // change icon
                        toggle.classList.toggle('bx-x')
                        // add padding to body
                        bodypd.classList.toggle('body-pd')
                        // add padding to header
                        headerpd.classList.toggle('body-pd')
                    })
                }
            }
            
            showNavbar('header-toggle','nav-bar','body-pd','header')
            
            /*===== LINK ACTIVE =====*/
            const linkColor = document.querySelectorAll('.nav_link')
            
            function colorLink(){
                if(linkColor){
                    linkColor.forEach(l=> l.classList.remove('active'))
                    this.classList.add('active')
                }
            }
            linkColor.forEach(l=> l.addEventListener('click', colorLink))
            
            // Toggle user menu
            const userToggle = document.getElementById('user-toggle');
            const userMenu = document.getElementById('user-menu');
            
            userToggle.addEventListener('click', () => {
                userMenu.style.display = userMenu.style.display === 'block' ? 'none' : 'block';
            });
            
            // Click outside to close
            window.addEventListener('click', (e) => {
                if (!userToggle.contains(e.target) && !userMenu.contains(e.target)) {
                    userMenu.style.display = 'none';
                }
            });
            
            // Set active link based on current URL
            function setActiveLink() {
                const currentPath = window.location.pathname;
                const navLinks = document.querySelectorAll('.nav_link');
                
                let bestMatch = null;
                let bestMatchLength = 0;
                
                navLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && currentPath.includes(href) && href.length > bestMatchLength) {
                        bestMatch = link;
                        bestMatchLength = href.length;
                    }
                    
                    // Handle exact matches
                    if (href === currentPath) {
                        bestMatch = link;
                    }
                });
                
                // Remove all active classes first
                navLinks.forEach(link => {
                    link.classList.remove('active');
                });
                
                // Add active class to best match
                if (bestMatch) {
                    bestMatch.classList.add('active');
                } else if (currentPath === '/user/home' || currentPath === '/user/') {
                    document.querySelector('a[href="/user/home"]')?.classList.add('active');
                }
            }
            
            setActiveLink();
        });
    </script>
</body>
</html>
