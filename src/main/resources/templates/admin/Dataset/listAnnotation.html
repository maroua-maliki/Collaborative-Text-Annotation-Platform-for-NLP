<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/template}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Annotations</title>
    <style>
        /* Animation */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeSlideIn 0.6s ease forwards;
        }
        
        /* List container */
        .list-container {
            padding: 1.5rem;
            max-width: 100%;
            margin: 0 auto;
            animation: fadeSlideIn 0.6s ease forwards;
        }
        
        /* Card styling */
        .list-card {
            background-color: var(--bg-card);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(10px);
            overflow: hidden;
            transition: all var(--transition-fast) ease;
            margin-bottom: 1.5rem;
        }
        
        /* Card header */
        .list-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(156, 163, 175, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1.125rem;
            flex-shrink: 0;
        }
        
        .header-text {
            margin: 0;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .dataset-name {
            font-weight: 500;
            color: var(--primary);
        }
        
        .header-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        /* Export buttons */
        .btn-export {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.875rem;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-dark);
            background-color: var(--bg-card);
            border: 1px solid var(--glass-border);
            transition: all var(--transition-fast) ease;
        }
        
        .btn-export:hover {
            background-color: var(--bg-sidebar-hover);
            transform: translateY(-2px);
            box-shadow: var(--glass-shadow);
        }
        
        .btn-export i {
            font-size: 0.875rem;
            color: var(--primary);
        }
        
        /* Card content */
        .list-body {
            padding: 1.5rem;
        }
        
        /* Alert styling */
        .alert {
            padding: 1rem 1.25rem;
            border-radius: var(--border-radius-md);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.875rem;
        }
        
        .alert-info {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.08), rgba(58, 12, 163, 0.04));
            border-left: 4px solid var(--primary);
            color: var(--text-dark);
        }
        
        .alert i {
            font-size: 1.25rem;
            color: var(--primary);
        }
        
        /* Table styling */
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--glass-border);
            margin-bottom: 1.5rem;
        }
        
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .data-table th {
            background-color: rgba(67, 97, 238, 0.05);
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            text-align: left;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .data-table tbody tr {
            transition: all var(--transition-fast) ease;
        }
        
        .data-table tbody tr:nth-child(even) {
            background-color: rgba(67, 97, 238, 0.02);
        }
        
        .data-table tbody tr:hover {
            background-color: rgba(67, 97, 238, 0.05);
        }
        
        .data-table td {
            padding: 1rem 1.25rem;
            vertical-align: top;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-dark);
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        /* Text container styling */
        .text-container {
            background-color: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-sm);
            padding: 1rem;
            max-height: 140px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-dark);
            transition: all var(--transition-fast) ease;
        }
        
        .text-container:hover {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.08);
        }
        
        /* Custom scrollbar for text containers */
        .text-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        .text-container::-webkit-scrollbar-track {
            background: rgba(156, 163, 175, 0.1);
            border-radius: 3px;
        }
        
        .text-container::-webkit-scrollbar-thumb {
            background: rgba(67, 97, 238, 0.2);
            border-radius: 3px;
        }
        
        .text-container::-webkit-scrollbar-thumb:hover {
            background: rgba(67, 97, 238, 0.4);
        }
        
        /* Badge styling */
        .annotation-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            border-radius: var(--border-radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1;
            margin-top: 0.5rem;
        }
        
        .badge-annotated {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 2px 5px rgba(67, 97, 238, 0.15);
        }
        
        .badge-not-annotated {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
        }
        
        /* Annotator name styling */
        .annotator-name {
            font-size: 0.95rem;
            color: var(--text-dark);
            display: block;
            margin-top: 0.75rem;
            font-weight: 500;
        }
        
        .annotator-icon {
            color: var(--primary);
            margin-right: 0.375rem;
        }
        
        .not-assigned {
            color: var(--text-medium);
            font-style: italic;
        }
        
        /* Pagination styling */
        .pagination-container {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .pagination {
            display: flex;
            gap: 0.3rem;
        }

        .page-item {
            list-style: none;
        }

        .page-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 0.75rem;
            border-radius: 8px;
            background-color: white;
            color: var(--text-color);
            border: 1px solid rgba(0, 0, 0, 0.1);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        
        .page-link:hover {
            background-color: var(--bg-sidebar-hover);
            color: var(--primary);
            border-color: var(--primary-light);
        }
        
        .page-item.active .page-link {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 5px rgba(67, 97, 238, 0.15);
        }
        
        .page-item.disabled .page-link {
            color: var(--text-light);
            pointer-events: none;
            background-color: var(--bg-card);
            border-color: var(--glass-border);
        }
        
        /* Back button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            margin-top: 1rem;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-medium);
            background-color: transparent;
            border: 1px solid var(--glass-border);
            transition: all var(--transition-fast) ease;
        }
        
        .btn-back:hover {
            background-color: var(--bg-sidebar-hover);
            color: var(--text-dark);
        }
        
        /* Edit button styling */
        .btn-edit-annotation {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--border-radius-sm);
            background-color: rgba(67, 97, 238, 0.1);
            color: var(--primary);
            margin-left: 0.5rem;
            transition: all var(--transition-fast) ease;
        }

        .btn-edit-annotation:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div layout:fragment="content1">
    <div class="container py-4">
        <div class="list-container animate-fade-in">
            <div class="list-card">
                <div class="list-header">
                    <div class="header-title">
                        <div class="header-icon">
                            <i class="bi bi-list-check"></i>
                        </div>
                        <h2 class="header-text">Liste des Annotations - <span class="dataset-name" th:text="${dataset.nomDataset}"></span></h2>
                    </div>
                    <div class="header-actions">
                        <a th:href="@{/admin/dataset/{id}/export/csv(id=${dataset.id})}" class="btn-export">
                            <i class="bi bi-filetype-csv"></i>
                            <span>Exporter CSV</span>
                        </a>
                        <a th:href="@{/admin/dataset/{id}/export/json(id=${dataset.id})}" class="btn-export">
                            <i class="bi bi-filetype-json"></i>
                            <span>Exporter JSON</span>
                        </a>
                    </div>
                </div>
                
                <div class="list-body">
                    <div class="alert alert-info" th:if="${#lists.isEmpty(coupleTexte)}">
                        <i class="bi bi-info-circle"></i>
                        <span>Aucun couple de texte disponible pour ce dataset.</span>
                    </div>

                    <div th:if="${not #lists.isEmpty(coupleTexte)}">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                <tr>
                                    <th width="35%">Texte 1</th>
                                    <th width="35%">Texte 2</th>
                                    <th width="15%">Annotation</th>
                                    <th width="15%">Annotateur</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="couple : ${coupleTexte}">
                                    <td>
                                        <div class="text-container" th:text="${couple.texte1}"></div>
                                    </td>
                                    <td>
                                        <div class="text-container" th:text="${couple.texte2}"></div>
                                    </td>
                                    <td>
                                        <span th:if="${couple.annotations != null}"
                                              class="annotation-badge badge-annotated"
                                              th:text="${couple.annotations.classeChoisie}"></span>
                                        <span th:if="${couple.annotations == null}"
                                              class="annotation-badge badge-not-annotated">Non annoté</span>
                                        
                                        <!-- Bouton d'édition -->
                                        <a th:if="${couple.annotations != null}" 
                                           th:href="@{/admin/dataset/edit-annotation/{coupleId}(coupleId=${couple.id}, datasetId=${dataset.id})}"
                                           class="btn-edit-annotation">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                    </td>
                                    <td>
                                        <span th:if="${couple.annotations != null && couple.annotations.annotateur != null}"
                                              class="annotator-name">
                                            <i class="bi bi-person-circle annotator-icon"></i>
                                            <span th:text="${couple.annotations.annotateur.nom + ' ' + couple.annotations.annotateur.prenom}"></span>
                                        </span>
                                        <span th:if="${couple.annotations == null && couple.taches != null && couple.taches.annotateur != null}"
                                              class="annotator-name">
                                            <i class="bi bi-person-circle annotator-icon"></i>
                                            <span th:text="${couple.taches.annotateur.nom + ' ' + couple.taches.annotateur.prenom}"></span>
                                        </span>
                                        <span th:if="${(couple.annotations == null || couple.annotations.annotateur == null) && (couple.taches == null || couple.taches.annotateur == null)}"
                                              class="not-assigned">Non assigné</span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                    <!-- Pagination -->
                    <div class="pagination-container">
                        <nav aria-label="Page navigation">
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/dataset/annotations/{id}(id=${dataset.id}, page=0, size=${pageSize})}" aria-label="Premier">
                                        <i class="bi bi-chevron-double-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/dataset/annotations/{id}(id=${dataset.id}, page=${currentPage - 1}, size=${pageSize})}" aria-label="Précédent">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    th:if="${i >= currentPage - 2 && i <= currentPage + 2}"
                                    th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/dataset/annotations/{id}(id=${dataset.id}, page=${i}, size=${pageSize})}" th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/dataset/annotations/{id}(id=${dataset.id}, page=${currentPage + 1}, size=${pageSize})}" aria-label="Suivant">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/dataset/annotations/{id}(id=${dataset.id}, page=${totalPages - 1}, size=${pageSize})}" aria-label="Dernier">
                                        <i class="bi bi-chevron-double-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>

                <div class="mt-4">
                    <a th:href="@{/admin/dataset/{id}(id=${dataset.id})}" class="btn-back">
                        <i class="bi bi-arrow-left"></i>
                        <span>Retour au dataset</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
